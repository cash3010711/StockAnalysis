[project]
name = "backend"
version = "0.1.0"
description = "Taiwan stock analyzer backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.150.0",
    "httpx>=0.28.1",
    "numpy>=2.5.4",
    "pandas>=3.0.6",
    "python-dotenv>=1.2.4",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
